[project]
name = "notificador-agencia-tributaria"
version = "0.1.0"
description = "Scraper y notificador de subastas de vehículos de la AEAT"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
notificador = "src.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
